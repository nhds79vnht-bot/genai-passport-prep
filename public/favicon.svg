<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="AI brain with book icon">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </radialGradient>
    <radialGradient id="brainGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff6fff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#c026d3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="smokeGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a21caf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brainCore" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="40%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </radialGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bgGrad)"/>

  <!-- Smoke / light beam rising from book -->
  <ellipse cx="128" cy="195" rx="22" ry="7" fill="#d946ef" opacity="0.35" filter="url(#glowFilter)"/>
  <path d="M110 195 Q114 160 118 130 Q122 100 128 88 Q134 100 138 130 Q142 160 146 195Z"
    fill="url(#smokeGrad)" opacity="0.6"/>
  <path d="M116 195 Q119 162 122 138 Q125 114 128 100 Q131 114 134 138 Q137 162 140 195Z"
    fill="url(#smokeGrad)" opacity="0.8"/>
  <!-- Extra glow wisps -->
  <path d="M120 192 Q121 165 123 145 Q126 118 128 105 Q130 118 133 145 Q135 165 136 192Z"
    fill="#e879f9" opacity="0.45" filter="url(#glowFilter)"/>

  <!-- Open Book -->
  <g filter="url(#softGlow)">
    <!-- Left page -->
    <path d="M50 200 Q88 188 128 192 L128 218 Q88 214 50 226 Z"
      fill="#1e1040" stroke="#9333ea" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M128 192 Q168 188 206 200 L206 226 Q168 214 128 218 Z"
      fill="#1e1040" stroke="#9333ea" stroke-width="1.5"/>
    <!-- Spine -->
    <line x1="128" y1="192" x2="128" y2="218" stroke="#d946ef" stroke-width="2.5"/>
    <!-- Page lines left -->
    <line x1="70" y1="201" x2="120" y2="197" stroke="#7e3ab5" stroke-width="1" opacity="0.7"/>
    <line x1="68" y1="207" x2="120" y2="204" stroke="#7e3ab5" stroke-width="1" opacity="0.5"/>
    <!-- Page lines right -->
    <line x1="136" y1="197" x2="186" y2="201" stroke="#7e3ab5" stroke-width="1" opacity="0.7"/>
    <line x1="136" y1="204" x2="188" y2="207" stroke="#7e3ab5" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Brain -->
  <g filter="url(#strongGlow)">
    <path
      fill="url(#brainCore)"
      d="M128 54
         C110 54 96 62 90 74
         C82 72 72 78 72 90
         C72 96 74 101 78 105
         C72 109 68 116 68 124
         C68 134 74 142 84 146
         C84 156 92 164 102 164
         C106 168 112 170 118 170
         L128 170
         L138 170
         C144 170 150 168 154 164
         C164 164 172 156 172 146
         C182 142 188 134 188 124
         C188 116 184 109 178 105
         C182 101 184 96 184 90
         C184 78 174 72 166 74
         C160 62 146 54 128 54Z"
    />
    <!-- Brain fold lines -->
    <path d="M128 62 C128 80 128 110 128 170" fill="none" stroke="#fce7f3" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M100 78 C106 90 108 108 106 128 C104 148 100 158 100 162" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <path d="M156 78 C150 90 148 108 150 128 C152 148 156 158 156 162" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <path d="M86 110 C96 106 112 104 128 104 C144 104 160 106 170 110" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M82 128 C92 124 112 122 128 122 C144 122 162 124 174 128" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <!-- Outer glow halo -->
    <path
      fill="none"
      stroke="#e879f9"
      stroke-width="4"
      opacity="0.3"
      d="M128 54
         C110 54 96 62 90 74
         C82 72 72 78 72 90
         C72 96 74 101 78 105
         C72 109 68 116 68 124
         C68 134 74 142 84 146
         C84 156 92 164 102 164
         C106 168 112 170 118 170
         L128 170 L138 170
         C144 170 150 168 154 164
         C164 164 172 156 172 146
         C182 142 188 134 188 124
         C188 116 184 109 178 105
         C182 101 184 96 184 90
         C184 78 174 72 166 74
         C160 62 146 54 128 54Z"
    />
  </g>

  <!-- Floating icons around brain -->

  <!-- Top-left: gear -->
  <g filter="url(#softGlow)" transform="translate(42, 52)">
    <circle cx="0" cy="0" r="13" fill="#2d1b4e" stroke="#d946ef" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#f0abfc" stroke-width="2"/>
    <g stroke="#d946ef" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-13" x2="0" y2="-9"/>
      <line x1="0" y1="9" x2="0" y2="13"/>
      <line x1="-13" y1="0" x2="-9" y2="0"/>
      <line x1="9" y1="0" x2="13" y2="0"/>
      <line x1="-9.2" y1="-9.2" x2="-6.4" y2="-6.4"/>
      <line x1="6.4" y1="6.4" x2="9.2" y2="9.2"/>
      <line x1="9.2" y1="-9.2" x2="6.4" y2="-6.4"/>
      <line x1="-6.4" y1="6.4" x2="-9.2" y2="9.2"/>
    </g>
  </g>

  <!-- Top-right: bar chart -->
  <g filter="url(#softGlow)" transform="translate(214, 52)">
    <circle cx="0" cy="0" r="13" fill="#2d1b4e" stroke="#d946ef" stroke-width="1.5"/>
    <rect x="-7" y="2" width="4" height="6" rx="1" fill="#f0abfc"/>
    <rect x="-1.5" y="-3" width="4" height="11" rx="1" fill="#d946ef"/>
    <rect x="4" y="-6" width="4" height="14" rx="1" fill="#f0abfc"/>
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#d946ef" stroke-width="1.5"/>
  </g>

  <!-- Right: hexagon with circuit dot -->
  <g filter="url(#softGlow)" transform="translate(222, 128)">
    <circle cx="0" cy="0" r="13" fill="#2d1b4e" stroke="#d946ef" stroke-width="1.5"/>
    <polygon points="0,-8 6.9,-4 6.9,4 0,8 -6.9,4 -6.9,-4" fill="none" stroke="#f0abfc" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="3" fill="#d946ef"/>
    <line x1="0" y1="-5" x2="0" y2="-8" stroke="#d946ef" stroke-width="1.2"/>
    <line x1="4.3" y1="2.5" x2="6" y2="4" stroke="#d946ef" stroke-width="1.2"/>
    <line x1="-4.3" y1="2.5" x2="-6" y2="4" stroke="#d946ef" stroke-width="1.2"/>
  </g>

  <!-- Left: circuit / chip -->
  <g filter="url(#softGlow)" transform="translate(34, 128)">
    <circle cx="0" cy="0" r="13" fill="#2d1b4e" stroke="#d946ef" stroke-width="1.5"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="none" stroke="#f0abfc" stroke-width="1.8"/>
    <line x1="-9" y1="-3" x2="-6" y2="-3" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="-9" y1="3" x2="-6" y2="3" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="6" y1="-3" x2="9" y2="-3" stroke="#d946ef" stroke-width="1.5"/>
    <line x1="6" y1="3" x2="9" y2="3" stroke="#d946ef" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#d946ef"/>
  </g>

  <!-- Center top: AI text badge -->
  <g filter="url(#strongGlow)" transform="translate(128, 36)">
    <rect x="-18" y="-11" width="36" height="22" rx="6" fill="#1a0530" stroke="#d946ef" stroke-width="1.5"/>
    <text x="0" y="5.5" text-anchor="middle" font-family="Arial Black, sans-serif"
          font-size="13" font-weight="900" fill="#f0abfc" letter-spacing="1">AI</text>
  </g>

</svg>
