<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Side-view brain with knowledge flowing in">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0c0a1a"/>
    </radialGradient>
    <linearGradient id="brainFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="knowledge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Knowledge streams entering from left -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M14 84 Q48 88 82 92 T148 98 T198 102" fill="none" stroke="url(#knowledge)" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 104 Q50 106 90 108 T155 112 T205 114" fill="none" stroke="url(#knowledge)" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 124 Q56 122 96 120 T160 116 T210 112" fill="none" stroke="url(#knowledge)" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 144 Q64 138 104 132 T168 124 T218 118" fill="none" stroke="url(#knowledge)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="42" cy="66" r="3" fill="#bae6fd"/>
    <circle cx="58" cy="96" r="2.5" fill="#c4b5fd"/>
    <circle cx="36" cy="134" r="2" fill="#fbcfe8"/>
    <circle cx="72" cy="156" r="2.5" fill="#bae6fd"/>
    <rect x="62" y="88" width="8" height="8" rx="1" fill="none" stroke="#e0f2fe" stroke-width="1"/>
    <rect x="94" y="118" width="8" height="8" rx="1" fill="none" stroke="#e0f2fe" stroke-width="1"/>
  </g>

  <!-- Side-view brain (lateral profile, facing right) -->
  <g filter="url(#glow)">
    <!-- Cerebrum -->
    <path fill="url(#brainFill)"
      d="M99 105 C96 89 102 74 116 61 C132 48 154 42 176 44
         C198 46 216 56 228 72 C236 84 238 98 236 112
         C234 126 226 140 212 150 C198 158 180 162 162 160
         C144 158 128 150 116 136 C106 124 100 114 99 105Z"/>
    <!-- Cerebellum -->
    <path fill="#be185d"
      d="M94 126 C88 136 88 148 94 158 C100 166 110 170 120 168
         C128 164 132 154 130 144 C126 134 118 128 108 126 C104 124 98 124 94 126Z"/>
    <!-- Brain stem -->
    <path fill="#9f1239" d="M114 158 L122 164 L124 180 L116 182 L110 172 Z"/>

    <!-- Sulci / gyri folds -->
    <path d="M114 61 C118 72 120 84 118 96 C116 108 112 118 108 126" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M139 56 C143 68 145 80 143 92 C141 104 137 114 132 124" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M164 58 C168 70 170 82 168 94 C166 106 160 116 154 126" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M186 68 C190 78 190 90 186 100 C182 110 176 118 170 126" fill="none" stroke="#fce7f3" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M104 89 L130 86 L156 84 L182 88" fill="none" stroke="#fce7f3" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M100 106 L128 103 L156 102 L184 106" fill="none" stroke="#fce7f3" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M196 292 C204 298 214 302 224 300" fill="none" stroke="#fce7f3" stroke-width="1.5" opacity="0.4" transform="translate(0,-130) scale(1.05)"/>

    <!-- Knowledge entry glow -->
    <ellipse cx="102" cy="108" rx="12" ry="14" fill="#67e8f9" opacity="0.35"/>
    <ellipse cx="104" cy="110" rx="6" ry="7" fill="#e0f2fe" opacity="0.6"/>

    <!-- Internal neural network -->
    <g opacity="0.7">
      <line x1="139" y1="89" x2="154" y2="84" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="154" y1="84" x2="169" y2="92" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="169" y1="92" x2="179" y2="106" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="179" y1="106" x2="174" y2="121" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="174" y1="121" x2="159" y2="129" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="159" y1="129" x2="144" y2="126" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="144" y1="126" x2="134" y2="112" stroke="#bae6fd" stroke-width="1.2"/>
      <line x1="134" y1="112" x2="139" y2="89" stroke="#bae6fd" stroke-width="1.2"/>
      <circle cx="139" cy="89" r="2.5" fill="#e0f2fe"/>
      <circle cx="154" cy="84" r="2.5" fill="#e0f2fe"/>
      <circle cx="169" cy="92" r="2.5" fill="#e0f2fe"/>
      <circle cx="179" cy="106" r="2.5" fill="#e0f2fe"/>
      <circle cx="159" cy="129" r="2.5" fill="#e0f2fe"/>
    </g>
  </g>
</svg>
